name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tools
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy typecheck
        run: mypy --ignore-missing-imports cli.py common.py tui.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system CHIRP
        run: |
          sudo apt-get update
          sudo apt-get install -y chirp
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Pytest
        run: pytest -q